<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Client-side inspection table with search, status/result filters, sort, and pagination." />
  <title>Table Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top">
    <p class="kicker">Table Engine</p>
    <h1>Sortable inspection table</h1>
  </header>
  <section class="toolbar">
    <label>Search<input id="search" type="search" placeholder="lot, part, inspector…" /></label>
    <label>Status
      <select id="status-filter">
        <option value="">All</option>
        <option>PLANNED</option>
        <option>IN_PROGRESS</option>
        <option>COMPLETED</option>
      </select>
    </label>
    <label>Result
      <select id="result-filter">
        <option value="">All</option>
        <option>PASS</option>
        <option>FAIL</option>
        <option>CONDITIONAL</option>
        <option>PENDING</option>
      </select>
    </label>
    <label>Page size
      <select id="page-size">
        <option>5</option>
        <option selected>10</option>
        <option>20</option>
      </select>
    </label>
    <button type="button" id="clear-filters" class="btn clear-btn" disabled>Clear filters</button>
  </section>
  <div class="table-shell">
    <table>
      <caption class="visually-hidden">Inspection lots with status, result, and last update</caption>
      <thead>
        <tr>
          <th scope="col" data-sort="lot" aria-sort="none"><button type="button">Lot</button></th>
          <th scope="col" data-sort="part" aria-sort="none"><button type="button">Part</button></th>
          <th scope="col" data-sort="inspector" aria-sort="none"><button type="button">Inspector</button></th>
          <th scope="col" data-sort="status" aria-sort="none"><button type="button">Status</button></th>
          <th scope="col" data-sort="result" aria-sort="none"><button type="button">Result</button></th>
          <th scope="col" data-sort="updated" aria-sort="descending"><button type="button">Updated</button></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <footer class="pager">
    <span id="page-info" role="status" aria-live="polite">Loading…</span>
    <div>
      <button type="button" id="prev" class="btn">Previous</button>
      <button type="button" id="next" class="btn">Next</button>
    </div>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
